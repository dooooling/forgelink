name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt / check / test / doc (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖（libudev：serialport/libudev-sys 需要）
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --workspace

      # --all-features：feature 门控的测试（collector/rest-api 控制链路、
      # test-utils 等）必须被 CI 强制覆盖，不能只靠本地自觉。
      - name: cargo test (--all-features)
        run: cargo test --workspace --all-features

      # 真实进程强杀 WAL 崩溃恢复（§103 kill -9 验收）：由 test-utils
      # feature 门控，默认 cargo test --workspace 不执行——单独启用
      # 该 feature 运行关键验收测试（Windows 句柄释放延迟已带重试；
      # Linux SIGKILL 下 WAL 恢复 0 丢失）。
      - name: cargo test (wal_crash, test-utils)
        run: cargo test -p local-buffer --all-features --test wal_crash

      - name: cargo doc
        run: cargo doc --workspace --no-deps

  # 目标平台含 Windows x64（§34.5 三平台验收）：至少在 CI 强制一个 Windows
  # job 抓平台差异——路径分隔符、句柄释放时序（local-buffer 已踩过）、信号
  # 语义等。覆盖与 Ubuntu 相同的测试面（--all-features 含 feature 门控测试）。
  ci-windows:
    name: check / test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (--all-targets --all-features)
        run: cargo check --workspace --all-targets --all-features

      # 真实进程强杀 WAL 崩溃恢复（§103 kill -9 验收）在 Windows 上依赖
      # 句柄释放重试，正是本 job 要强制覆盖的场景。
      - name: cargo test (--all-features, wal_crash)
        run: cargo test -p local-buffer --all-features --test wal_crash

      - name: cargo test (--workspace --all-features)
        run: cargo test --workspace --all-features

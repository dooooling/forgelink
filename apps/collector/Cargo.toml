[package]
name = "collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["collector"]

# 纯采集运行时（§92/§93/§98）：编译期不含控制链路。
# `collector` 由三个子 feature 组合，逐个落地真实依赖：
#   driver-read  -> 采集与映射链路（device-manager/poll-engine/driver-loader/...）
#   mqtt         -> 北向 MQTT 输出
#   local-cache  -> Local Buffer/WAL（断线落盘、按序补传）
collector = [
    "driver-read",
    "mqtt",
    "local-cache",
    "rest-api",
]

# 启用控制链路（§98）：只读采集之上叠加写入与控制面。
# - driver-read：控制执行器路由到 DeviceManager 管理的共享 Driver 会话，
#   设备目录亦来自注册后的设备全集（控制与采集共用同一设备注册表）；
# - driver-write：写入链路语义标记（§98 特性词汇，见下）；
# - control-engine：ControlEngine 装配 + rest-api/control 控制路由。
# 必须验证只读构建
# （cargo check -p collector --no-default-features --features collector）
# 的产物不包含控制代码（本 crate 全部控制装配代码以
# `#[cfg(feature = "control")]` 门控）。
control = [
    "driver-read",
    "driver-write",
    "control-engine",
]

driver-read = [
    "dep:device-manager",
    "dep:driver-loader",
    "dep:driver-sdk",
    "dep:poll-engine",
    "dep:profile-engine",
    "dep:domain-model",
    "dep:observation-model",
    "dep:data-pipeline",
    "dep:diagnostics",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:tokio",
]
# REST v1 只读管理接口（§31.5/§31.6/§90.1）：只读适配层与 HTTP 服务器。
rest-api = ["dep:rest-api"]
mqtt = ["dep:mqtt-client"]
local-cache = ["dep:local-buffer"]
# 写入链路标记（§98）：实际写能力由 `control-engine` feature 引入的
# DeviceControlExecutor（device-manager，按 device_id 路由到共享 Driver
# 会话）承载，本 feature 保持空标记以维持设计文档的特性词汇，并为将来
# 按协议拆分写依赖预留挂点。
driver-write = []
# 控制引擎（§81-§90）：显式 feature 与同名可选依赖并存——`dep:` 语法
# 启用依赖，同时级联启用 rest-api 的 control feature（控制端点仅在该
# feature 下挂载）；async-trait 供 collector 侧审计汇实现 AuditSink。
control-engine = ["dep:control-engine", "dep:async-trait", "rest-api/control"]

[dependencies]
# 采集与映射链路（driver-read）
data-pipeline = { path = "../../crates/data-pipeline", optional = true }
device-manager = { path = "../../crates/device-manager", optional = true }
diagnostics = { path = "../../crates/diagnostics", optional = true }
domain-model = { path = "../../crates/domain-model", optional = true }
driver-loader = { path = "../../crates/driver-loader", optional = true }
driver-sdk = { path = "../../crates/driver-sdk", optional = true }
observation-model = { path = "../../crates/observation-model", optional = true }
poll-engine = { path = "../../crates/poll-engine", optional = true }
profile-engine = { path = "../../crates/profile-engine", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"], optional = true }

# 北向 MQTT 输出（mqtt）
mqtt-client = { path = "../../crates/mqtt-client", optional = true }

# Local Buffer/WAL（local-cache）
local-buffer = { path = "../../crates/local-buffer", optional = true }

# REST v1 只读管理接口（rest-api feature）。
rest-api = { path = "../../crates/rest-api", optional = true }

# 控制链路依赖（仅 control-engine/control feature 时编译进产物）：
async-trait = { version = "0.1", optional = true }
control-engine = { path = "../../crates/control-engine", optional = true }

tracing = "0.1"

[dev-dependencies]
modbus-mock = { path = "../../crates/modbus-mock" }
mqtt-client = { path = "../../crates/mqtt-client", features = ["test-utils"] }
rest-api = { path = "../../crates/rest-api", features = ["test-utils"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
